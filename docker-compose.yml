services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    
    environment:
      DATABASE_URL: sqlite:////app/ecommerce.db
      FIREBASE_PROJECT_ID: "commerceiq-ai"
    volumes:
      - ./backend/ecommerce.db:/app/ecommerce.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
